services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: goldenhour
      POSTGRES_USER: goldenhour
      POSTGRES_PASSWORD: goldenhour-dev-only
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U goldenhour -d goldenhour"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    ports: ["4000:4000"]
    env_file: ["./backend/.env"]
    environment:
      DATABASE_URL: postgresql://goldenhour:goldenhour-dev-only@postgres:5432/goldenhour
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
