# One isolated hospital per deployment. Supply two credentials for the same private TLS database.
services:
  migrate:
    build: ./backend
    environment:
      NODE_ENV: production
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set migration credentials}
      DB_SSL: "true"
      DB_CA: /run/secrets/db_ca
    secrets: [db_ca]
    command: ["node", "dist/migrate.js"]
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment: &runtime_environment
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set runtime credentials}
      DB_SSL: "true"
      DB_CA: /run/secrets/db_ca
      JWT_SECRET: ${JWT_SECRET:?Set JWT signing secret}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TRANSIT_KEY: ${VAULT_TRANSIT_KEY:-}
      VAULT_TOKEN_FILE: /run/vault/token
      KMS_MASTER_KEY: ${KMS_MASTER_KEY:?Set wrapping key}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set record encryption key}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:?Set hospital administrator user IDs}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:?Set SMS provider credential}
      MSG91_FLOW_ID: ${MSG91_FLOW_ID:?Set approved SMS flow}
      WALLET_AUTH_ENABLED: "false"
      HOSPITAL_NAME: ${HOSPITAL_NAME:?Set hospital display name}
      FRONTEND_ORIGIN: https://${PUBLIC_HOST:?Set hospital hostname}
      AUTH_DOMAIN: ${PUBLIC_HOST}
      AUTH_URI: https://${PUBLIC_HOST}
      TRUST_PROXY: "true"
    secrets: [db_ca]
    volumes:
      - ${VAULT_TOKEN_DIR:-./deploy/empty-vault}:/run/vault:ro
    command: ["node", "dist/app.js"]
  worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment: *runtime_environment
    secrets: [db_ca]
    volumes:
      - ${VAULT_TOKEN_DIR:-./deploy/empty-vault}:/run/vault:ro
    command: ["node", "dist/worker.js"]
    healthcheck:
      test: ["CMD", "node", "dist/worker-health.js"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /
    restart: unless-stopped
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - gateway_data:/data
    depends_on: [backend, frontend]
secrets:
  db_ca:
    file: ${DB_CA:?Set path to database CA certificate}
volumes:
  gateway_data:
