name: CI
on:
  push:
    branches: ["main", "**"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
concurrency:
  group: goldenhour-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: backend/package-lock.json}
      - run: npm ci
      - run: node ../scripts/ciSecretScan.js
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run build
      - run: npm test
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
  postgres:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run test:postgres
      - run: npm ci --prefix ../frontend
      - run: npm run build --prefix ../frontend
        env:
          VITE_API_URL: /
      - run: npx playwright install --with-deps chromium
      - run: node integration/browser.js
        env:
          BROWSER_CHANNEL: chromium

      - run: node ../scripts/pwa-browser.cjs
        env:
          BROWSER_CHANNEL: chromium
  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          load: true
          tags: goldenhour-ci:${{ matrix.component }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: goldenhour-ci:${{ matrix.component }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run verify:code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-verification-evidence
          path: |
            STATUS.md
            artifacts/verification
          retention-days: 30
