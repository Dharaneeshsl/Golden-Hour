name: CI
on:
  push:
    branches: ["main", "**"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
concurrency:
  group: goldenhour-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run compile
      - run: npm test
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: backend/package-lock.json}
      - run: npm ci
      - run: node ../scripts/ciSecretScan.js
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm test
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
  postgres:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm ci
      - run: npm run db:migrate
      - run: node --test integration/postgres-login.js
      - run: npm ci --prefix ../frontend
      - run: npm run build --prefix ../frontend
        env:
          VITE_API_URL: /
      - run: npx playwright install --with-deps chromium
      - run: node integration/browser.js
        env:
          BROWSER_CHANNEL: chromium
